name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ubuntu-latest ships the Android SDK (ANDROID_HOME); setup-android@v3 currently
      # fails on the runners while installing the removed "tools" package.

      # The China mirrors in settings.gradle.kts are slow/unreliable from GitHub runners.
      - name: Use upstream Maven repositories on the runner
        run: sed -i '/maven.aliyun.com/d' settings.gradle.kts

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain
